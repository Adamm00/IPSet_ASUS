on:
  push:
    branches:
      - master
  pull_request:

name: ShellCheck
permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install ShellCheck 0.11.0
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
      - name: Check production script
        shell: bash
        run: |
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --norc --shell=busybox firewall.sh
